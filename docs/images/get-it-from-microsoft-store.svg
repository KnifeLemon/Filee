<svg xmlns="http://www.w3.org/2000/svg" width="158" height="40" viewBox="0 0 158 40" role="img" aria-label="Get it from Microsoft Store"
  xmlns:c2pa="http://c2pa.org/manifest">
  
  <title>Get it from Microsoft Store</title>
  <rect x="0.5" y="0.5" width="157" height="39" rx="6" fill="#000000" stroke="#a6a6a6"/>
  <!-- Four-square logo, 20x20 -->
  <g transform="translate(11 10)">
    <rect x="0" y="0" width="9.5" height="9.5" fill="#f25022"/>
    <rect x="10.5" y="0" width="9.5" height="9.5" fill="#7fba00"/>
    <rect x="0" y="10.5" width="9.5" height="9.5" fill="#00a4ef"/>
    <rect x="10.5" y="10.5" width="9.5" height="9.5" fill="#ffb900"/>
  </g>
  <g fill="#ffffff" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="40" y="16" font-size="8.5">Get it from</text>
    <!-- textLength keeps the line the same width in every font -->
    <text x="40" y="31" font-size="13" font-weight="600" textLength="106" lengthAdjust="spacingAndGlyphs">Microsoft Store</text>
  </g>
</svg>