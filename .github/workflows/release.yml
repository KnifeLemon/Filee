# Builds the Windows installer and publishes it to GitHub Releases.
# Trigger: push a tag like v1.0.0  (git tag v1.0.0 && git push origin v1.0.0)
#
# Output (Velopack): Filee-<version>-win-Setup.exe, Filee-<version>-win-Portable.zip, and the update feed
# (releases.win.json + full/delta .nupkg) the next release builds its delta package from.
# Release notes are generated by GitHub from the pull requests merged since the previous release, grouped by label
# (.github/release.yml), with their authors and new contributors.
# Large engines are not in the installer; the app offers them on first run and in Settings > Engines.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      PUBLISH_DIR: publish/win-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Fonts
        shell: pwsh
        run: ./build/fetch-fonts.ps1

      - name: Test
        run: dotnet test Filee.slnx -c Release

      - name: Publish
        run: >
          dotnet publish src/Filee.App/Filee.App.csproj -c Release -r win-x64 --self-contained
          -p:Version=${{ steps.version.outputs.value }}
          -p:PublishReadyToRun=true
          -o ${{ env.PUBLISH_DIR }}

      # Only the small rhwp is bundled. LibreOffice (+ H2Orestart, Java) and Pandoc are large and are downloaded by
      # the app when the user picks them (first-run setup or Settings > Engines), see engines.json.
      - name: Bundle conversion engines (rhwp, 7-Zip)
        shell: pwsh
        run: ./build/fetch-engines.ps1 -Only rhwp,7zip -Destination "${{ env.PUBLISH_DIR }}/engines"

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Download previous release (for delta updates)
        run: vpk download github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} -o Releases
        continue-on-error: true

      - name: Pack
        run: >
          vpk pack --packId Filee --packVersion ${{ steps.version.outputs.value }}
          --packDir ${{ env.PUBLISH_DIR }} --mainExe Filee.exe --packTitle Filee
          --icon src/Filee.App/Assets/Icons/filee.ico -o Releases

      # People download these two, so their names carry the version. The update feed keeps Velopack's names.
      - name: Name downloads after the version
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          Get-ChildItem Releases -Filter '*-Setup.exe' | Rename-Item -NewName "Filee-$version-win-Setup.exe"
          Get-ChildItem Releases -Filter '*-Portable.zip' | Rename-Item -NewName "Filee-$version-win-Portable.zip"
          Get-ChildItem Releases | Format-Table Name, Length

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.value }}'
          # assets.win.json only describes the local build folder.
          $files = Get-ChildItem Releases -File | Where-Object Name -ne 'assets.win.json' | ForEach-Object FullName
          gh release create '${{ github.ref_name }}' --title "Filee $version" --generate-notes --verify-tag @files
