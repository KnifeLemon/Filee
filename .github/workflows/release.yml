# Builds the Windows installer and publishes it to GitHub Releases.
# Trigger: push a tag like v1.0.0  (git tag v1.0.0 && git push origin v1.0.0)
#
# Output (build/build-installer.ps1): Filee-<version>-win-Setup.exe (Filee's own installer, src/Filee.Setup),
# Filee-<version>-win-Portable.zip and Filee-<version>-SHA256SUMS.txt.
# The release is a draft with the Linux and macOS packages: the Windows files are signed on a PC signed in to Certum's
# SimplySign cloud (its key needs a phone token), so this run keeps the tested, unsigned build as the artifact
# windows-unsigned, and build/sign-release.ps1 signs it, packs Setup again, uploads the Windows files and publishes.
# Release notes: the version's section of CHANGELOG.md (what changed, for people using Filee), then the list GitHub
# generates from the pull requests merged since the previous release, grouped by label (.github/release.yml), with
# their authors and new contributors.
# Large engines are not in the installer; its engine page (or the app, on first run and in Settings > Engines)
# downloads them.
# Supply chain (docs/RELEASE-SECURITY.md): actions are pinned to commits, the workflow token can only read except in
# the job that drafts the release, the packages get a build provenance attestation and an SBOM, and with the
# FILEE_UPDATE_SIGNING_KEY secret set the checksum files are signed for the updater (build/sign-checksums.ps1).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  portable:
    permissions:
      contents: read
    uses: ./.github/workflows/portable.yml
    with:
      version: ${{ github.ref_name }}

  windows:
    needs: portable
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write       # draft the release
      id-token: write       # sign the build provenance attestation (Sigstore)
      attestations: write   # store it with the repository
    env:
      # Optional: without the secret the checksum files stay unsigned (sign-checksums.ps1 only warns).
      FILEE_UPDATE_SIGNING_KEY: ${{ secrets.FILEE_UPDATE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Fonts
        shell: pwsh
        run: ./build/fetch-fonts.ps1

      - name: Restore Zig toolchain
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/.cache/zig-x86_64-windows-0.16.0
          key: zig-0.16.0-x86_64-windows

      # Windows 11 top-level Explorer menu: FileeExplorerMenu.dll (C, built with a pinned Zig toolchain) and the
      # unsigned sparse package FileeExplorerMenu.msix. Built before the tests so they check the real files.
      - name: Build Explorer menu extension
        shell: pwsh
        run: ./build/build-explorer-menu.ps1 -Version ${{ steps.version.outputs.value }}

      # Same engines as CI, so the release runs the same tests (they are not part of the installer).
      - name: Fetch rhwp, Pandoc and 7-Zip for engine tests
        shell: pwsh
        run: ./build/fetch-engines.ps1 -Only rhwp,pandoc,7zip

      # Built first and tested like CI: the UI tests on their own with crash and hang blame (a crash names the
      # running test and leaves a dump in TestResults), then the rest.
      - name: Build
        run: dotnet build Filee.slnx -c Release

      - name: Test UI on its own
        run: dotnet test tests/Filee.App.Tests --no-build -c Release --blame-crash --blame-hang-timeout 5m --logger "console;verbosity=normal" --results-directory TestResults/app

      - name: Test
        run: dotnet test Filee.slnx --no-build -c Release --filter "FullyQualifiedName!~Filee.App.Tests"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-windows
          path: TestResults/
          if-no-files-found: ignore

      # Publishes the app (Release, self-contained, ReadyToRun) with the Explorer menu extension and the bundled rhwp
      # and 7-Zip and the Microsoft C++ runtime, publishes Setup (one self-contained file), appends the app to it as a
      # checked payload and zips the portable copy.
      - name: Build installer and portable zip
        shell: pwsh
        run: ./build/build-installer.ps1 -Version ${{ steps.version.outputs.value }} -Portable

      # The publish folder and the Setup program as tested, for build/sign-release.ps1 (artifacts leave out hidden
      # folders such as build/.cache, so both are moved into one folder first).
      - name: Keep the unsigned Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path unsigned | Out-Null
          Move-Item publish/win-x64 unsigned/app
          Copy-Item build/.cache/setup/Filee.Setup.exe unsigned/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-unsigned
          path: unsigned/
          if-no-files-found: error
          retention-days: 30

      - name: Download Linux and macOS packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: portable-*
          merge-multiple: true
          path: Releases

      # What the release is made of (NuGet packages and their versions), next to the packages.
      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: unsigned/app
          format: spdx-json
          output-file: Releases/Filee-${{ steps.version.outputs.value }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Sign the checksum files for the updater
        shell: pwsh
        run: |
          $sums = @(Get-ChildItem Releases -File -Filter '*-SHA256SUMS.txt' | ForEach-Object FullName)
          if ($sums.Count) { ./build/sign-checksums.ps1 -Path $sums }

      # Anyone can check that a package came out of this workflow run: gh attestation verify <file> -R <repository>.
      # The Windows files are signed later on a PC (build/sign-release.ps1): their attestation covers the tested,
      # unsigned build they are signed from.
      - name: Build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            Releases/Filee-*
            unsigned/Filee.Setup.exe
            unsigned/app/Filee.exe

      - name: Draft the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.value }}'
          # Linux and macOS only: build/sign-release.ps1 adds the signed Windows files.
          # The Windows checksum file and its signature change once the Windows files are signed.
          $windows = "Filee-$version-win-Setup.exe", "Filee-$version-win-Portable.zip", "Filee-$version-SHA256SUMS.txt",
                     "Filee-$version-SHA256SUMS.txt.sig"
          $files = Get-ChildItem Releases -File -Filter "Filee-$version-*" | Where-Object Name -notin $windows | ForEach-Object FullName
          # "## 1.4.0" up to the next "## " heading of CHANGELOG.md, without the heading itself.
          $changes = ''
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          if ($changelog -match "(?ms)^## $([regex]::Escape($version))[ \t]*\r?\n(.*?)(?=^## |\z)") {
            # One line per list item: GitHub shows the line breaks of the 120-column file in release notes. Indented
            # lines continue the item above, unless they start a nested item ("  - "), which keeps its own line.
            $changes = $Matches[1].Trim() -replace '\r?\n +(?!- |\* |\d+\. )(?=\S)', ' '
          }
          if (-not $changes) { Write-Warning "CHANGELOG.md has no section for $version" }

          # GitHub's generated notes: the merged pull requests (one list instead of its label headings, which would
          # repeat the CHANGELOG's), new contributors and the full changelog link.
          $generated = (gh api -X POST "repos/${{ github.repository }}/releases/generate-notes" -f tag_name='${{ github.ref_name }}' | ConvertFrom-Json).body
          $prs = @()
          if ($generated -match "(?ms)^## What's Changed[ \t]*\r?\n(.*?)(?=^## |^\*\*Full Changelog|\z)") {
            $prs = @($Matches[1] -split '\r?\n' | Where-Object { $_ -match '^\* ' })
          }
          $tail = if ($generated -match "(?ms)(^## New Contributors.*|^\*\*Full Changelog.*)") { $Matches[1].Trim() } else { '' }

          $parts = @("## What's Changed")
          if ($changes) { $parts += $changes }
          if ($prs.Count) { $parts += "### Pull requests`n`n" + ($prs -join "`n") }
          if ($tail) { $parts += $tail }
          $notesFile = Join-Path $env:RUNNER_TEMP 'notes.md'
          Set-Content $notesFile ($parts -join "`n`n") -Encoding utf8
          gh release create '${{ github.ref_name }}' --draft --title "Filee $version" --notes-file $notesFile --verify-tag @files
