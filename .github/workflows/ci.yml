# Build, test and style check on every push and pull request.
name: CI

# Changes to documentation and repository metadata only skip the build and tests (see the changes job).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push cancels the run it replaces, on pull requests and on main. Main cancels too because macOS runners are
# few and queue: when several PRs are merged in a row, the older main runs would keep them busy for hours. Only the
# last commit on main runs to the end, and since it contains all the commits before it, nothing goes untested. A
# docs-only push can't hide a code push it cancelled: the changes job compares a push to main with the last main run
# whose build passed, so the cancelled code is still in the file list and gets built.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Decides what the change needs. The workflow always runs, so the required `build` check (the gate job below)
  # always reports: a job skipped by its condition counts as passed for the branch rules.
  # - code: anything besides documentation and repository metadata. When the file list can't be read, everything runs.
  # - macos: the macOS packages and tests. macOS runners are few and queue, so a pull request runs them only when it
  #   touches macOS files, code that branches on macOS, the projects, packages or build scripts, or carries the
  #   `macos` label (add it, then re-run the workflow). Pushes to main always run them.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      code: ${{ steps.files.outputs.code }}
      macos: ${{ steps.files.outputs.macos }}
    steps:
      - uses: actions/checkout@v7

      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AFTER: ${{ github.sha }}
        run: |
          everything() { echo "code=true" >> "$GITHUB_OUTPUT"; echo "macos=true" >> "$GITHUB_OUTPUT"; echo "$1"; exit 0; }

          if [ -n "$PR" ]; then
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename') || everything "File list unreadable"
          else
            # A push to main can cancel the run of an earlier push. So compare with the last main run whose build
            # passed, not only with the previous commit: a docs-only push then still builds the code that was cancelled.
            base=""
            runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&event=push&status=completed&per_page=30" \
              --jq '.workflow_runs[] | select(.conclusion == "success") | "\(.id) \(.head_sha)"') || everything "Run list unreadable"
            while read -r id sha; do
              [ -z "$id" ] && continue
              built=$(gh api "repos/$REPO/actions/runs/$id/jobs" \
                --jq '[.jobs[] | select(.name == "windows / build (win-x64)" and .conclusion == "success")] | length') || built=0
              if [ "$built" != 0 ]; then base=$sha; break; fi
            done <<< "$runs"
            if [ -z "$base" ]; then everything "No earlier main run that built"; fi
            # The compare API lists at most 300 files.
            files=$(gh api "repos/$REPO/compare/$base...$AFTER" \
              --jq 'if (.files | length) >= 300 then "(too many)" else .files[].filename end') || everything "File list unreadable"
          fi
          if [ "$files" = "(too many)" ]; then everything "Too many files to list"; fi

          code=false
          macos=false
          if [ -z "$PR" ]; then
            macos=true
          else
            labels=$(gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name') || labels=macos
            if grep -qx macos <<< "$labels"; then macos=true; echo "Labelled macos"; fi
          fi

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|docs/*|LICENSE|.mailmap|.github/CODEOWNERS|.github/ISSUE_TEMPLATE/*|.github/labeler.yml|.github/FUNDING.yml|.github/release.yml|.github/PULL_REQUEST_TEMPLATE*|.github/workflows/label-issue.yml|.github/workflows/label-pr.yml)
                continue ;;
            esac
            if [ "$code" = false ]; then echo "Needs the build: $f"; fi
            code=true
            if [ "$macos" = true ]; then continue; fi
            case "$f" in
              .github/workflows/*|build/*|installer/macos/*|*MacOS*|*.csproj|*.props|*.targets|*.slnx|global.json|src/Filee.Engines/Infrastructure/engines.json)
                macos=true ;;
              *.cs|*.axaml)
                # Shared code with a macOS branch. A deleted file has no content and only counts by its name.
                if [ -f "$f" ] && grep -qE 'IsMacOS|OSPlatform\.OSX|"osx' "$f"; then macos=true; fi ;;
            esac
            if [ "$macos" = true ]; then echo "Needs macOS: $f"; fi
          done <<< "$files"

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "macos=$macos" >> "$GITHUB_OUTPUT"

  portable:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    uses: ./.github/workflows/portable.yml
    with:
      macos: ${{ needs.changes.outputs.macos != 'false' }}

  # Both Windows builds (x64 and ARM64) are in build.yml, so they show up under this one job.
  windows:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    uses: ./.github/workflows/build.yml

  # The required check. It always runs, so a docs-only change (windows skipped) passes and a failed or
  # cancelled Windows build fails it.
  build:
    needs: [changes, windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Windows builds passed or were not needed
        run: |
          case "${{ needs.windows.result }}" in
            success|skipped) ;;
            *) echo "Windows builds: ${{ needs.windows.result }}"; exit 1 ;;
          esac

  # The metadata writer on Linux, with the Perl ExifTool pinned in engines.json (the Windows builds above are its Windows side),
  # and the exact seeks of the video tools with Ubuntu's FFmpeg (no other job has FFmpeg, so they skip there).
  metadata-linux:
    name: metadata (linux-x64)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Ubuntu's FFmpeg pulls in about a hundred packages. The runner's man-db trigger rebuilds the manual index after
      # them (minutes on its own), and a slow mirror has stalled the step past the job's limit, so: no man-db update,
      # no recommends, apt timeouts and retries, and a step limit that fails fast instead of eating the job's.
      - name: FFmpeg for the video test
        timeout-minutes: 12
        run: |
          set -euo pipefail
          sudo rm -f /var/lib/man-db/auto-update
          apt="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Dpkg::Use-Pty=0"
          for attempt in 1 2 3; do
            if sudo timeout 240 apt-get $apt update -q &&
               sudo DEBIAN_FRONTEND=noninteractive timeout 420 apt-get $apt install -y -q --no-install-recommends ffmpeg; then
              break
            fi
            [ "$attempt" = 3 ] && exit 1
            echo "::warning::apt attempt $attempt failed; trying again"
            sleep 10
          done
          ffmpeg -hide_banner -version | sed -n 1p

      - name: Fetch ExifTool
        run: |
          set -euo pipefail
          read -r url sha256 < <(jq -r '.platforms."linux-x64".components.exiftool | "\(.url) \(.sha256)"' src/Filee.Engines/Infrastructure/engines.json)
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/exiftool.tar.gz" "$url"
          echo "$sha256  $RUNNER_TEMP/exiftool.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/exiftool"
          tar -xzf "$RUNNER_TEMP/exiftool.tar.gz" -C "$RUNNER_TEMP/exiftool" --strip-components=1
          echo "FILEE_TEST_EXIFTOOL=$RUNNER_TEMP/exiftool/exiftool" >> "$GITHUB_ENV"
          # On the PATH too: the conversion test goes through Filee's own search and the Perl check.
          echo "$RUNNER_TEMP/exiftool" >> "$GITHUB_PATH"

      - name: Test
        run: dotnet test tests/Filee.Engines.Tests -c Release --filter "FullyQualifiedName~MetadataTests"

      # Exact seeks (#1205): every frame of numbered MP4, MPEG-TS, MPEG-PS and open-GOP HEVC videos, and clips, playback
      # and Live Photos from MPEG-TS. FILEE_TEST_FFMPEG=required makes a missing FFmpeg fail them instead of skipping.
      - name: Test exact seeks
        env:
          FILEE_TEST_FFMPEG: required
        run: dotnet test tests/Filee.Engines.Tests -c Release --no-build --filter "FullyQualifiedName~ExactSeekTests"

      # Again with the FFmpeg Filee installs (engines.json), which it finds in engines/ before the system's: FFmpeg's
      # seeking and timing differ between versions, and Ubuntu's is 6.1. FILEE_TEST_FFMPEG_FOLDER fails the tests if
      # they find another FFmpeg.
      - name: Test exact seeks with Filee's FFmpeg
        env:
          FILEE_TEST_FFMPEG: required
          FILEE_TEST_FFMPEG_FOLDER: ${{ github.workspace }}/engines/ffmpeg
        run: |
          set -euo pipefail
          read -r url sha256 < <(jq -r '.platforms."linux-x64".components.ffmpeg | "\(.url) \(.sha256)"' src/Filee.Engines/Infrastructure/engines.json)
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ffmpeg.tar.xz" "$url"
          echo "$sha256  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum --check
          mkdir -p engines/ffmpeg
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C engines/ffmpeg --strip-components=1
          engines/ffmpeg/bin/ffmpeg -hide_banner -version | sed -n 1p
          dotnet test tests/Filee.Engines.Tests -c Release --no-build --filter "FullyQualifiedName~ExactSeekTests"
